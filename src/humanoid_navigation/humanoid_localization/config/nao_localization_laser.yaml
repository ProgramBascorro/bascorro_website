# 6D localization configuration for the Nao humanoid with laser head

humanoid_localization:  # Must match your node name in the launch file
  ros__parameters:
    # raycasting (slow) or endpoint model (approx)
    use_raycasting: true
    
    num_particles: 500
    init_global: false
    init_from_truepose: false
    
    # rel. number of effective particles for resampling threshold
    neff_factor: 1.0 
    
    sensor_sampling_dist: 0.25
    
    # min traversed odometry interval between laser measurements
    update_min_trans: 0.2
    update_min_rot: 0.4
    
    # laser obs. model (for raycasting only)
    raycasting:
      z_hit: 0.8
      z_short: 0.1
      z_max: 0.05
      z_rand: 0.05
      sigma_hit: 0.02
      lambda_short: 0.1
    
    # laser obs.model (for endpoint model only)
    endpoint:
      sigma: 0.05
    
    motion_sigma_z: 0.02
    motion_sigma_roll: 0.015
    motion_sigma_pitch: 0.015
    
    # noise of the motion model
    motion_noise:
      z: 0.05
      roll: 0.1
      pitch: 0.1
      xx: 0.03
      xy: 0.05
      xt: 0.0003
      yx: 0.13
      yy: 0.09
      yt: 0.004
      tx: 1.58
      ty: 1.03
      tt: 0.11
    
    # odometry calibration for 2D drift
    motion_calib:
      xx: 1.0
      xy: 0.0
      xt: 0.0
      yx: 0.0
      yy: 1.0
      yt: 0.0
      tx: 0.0
      ty: 0.0
      tt: 1.0
    
    # initial pose
    initial_pose:
      x: 2.0
      y: 2.0
      z: 0.31
      roll: 0.0
      pitch: 0.0
      yaw: 4.71
    
    # std dev for initial noise
    initial_std:
      x: 0.03
      y: 0.03
      z: 0.015
      roll: 0.04
      pitch: 0.04
      yaw: 0.2