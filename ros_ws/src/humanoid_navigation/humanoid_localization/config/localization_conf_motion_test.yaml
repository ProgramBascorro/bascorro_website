# Motion test configuration for humanoid localization

octomap_server:  # This needs to match the node name in your launch file
  ros__parameters:
    use_raycasting: true
    init_from_truepose: true
    num_particles: 1
    neff_factor: 0

    # Initial pose standard deviations
    initial_std:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    # Motion noise parameters (nested format replaces slashes)
    motion_noise:
      xx: 0.0
      yy: 0.0
      zz: 0.0
      RR: 0.0  # roll
      PP: 0.0  # pitch
      YY: 0.0  # yaw